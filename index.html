<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and Video Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --accent-border: #bfdbfe;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
            --radius-lg: 14px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="dark"] {
            --bg-page: #090d16;
            --bg-card: #131a2a;
            --bg-subtle: #1c263c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-light: rgba(56, 189, 248, 0.12);
            --accent-border: rgba(56, 189, 248, 0.3);
            --accent-hover: #0ea5e9;
            --border: #232f48;
            --border-hover: #334155;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            transition: background-color 0.25s ease, color 0.25s ease;
            padding-bottom: 4rem;
        }

        /* Top Header */
        .header-nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .btn-theme {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.45rem 0.85rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .btn-theme:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        /* Hero */
        .hero {
            max-width: 900px;
            margin: 2.5rem auto 1.5rem auto;
            padding: 0 1.5rem;
        }

        .hero h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Controls */
        .controls-bar {
            max-width: 900px;
            margin: 1.25rem auto;
            padding: 0 1.5rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 240px;
            max-width: 450px;
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.4rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.92rem;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .btn-action {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.65rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-action:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Modules Container */
        .modules-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Module Accordion Card */
        .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .module-card:hover {
            border-color: var(--border-hover);
        }

        .module-card.active {
            border-color: var(--accent-border);
        }

        /* Module Trigger */
        .module-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            background: var(--bg-card);
            transition: background 0.15s ease;
        }

        .module-header:hover {
            background: var(--bg-subtle);
        }

        .module-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .module-icon-badge {
            width: 42px;
            height: 42px;
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .module-title-wrap h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .module-meta-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .file-counter-pill {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .chevron-icon {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: transform 0.25s ease;
        }

        .module-card.active .chevron-icon {
            transform: rotate(180deg);
            color: var(--accent);
        }

        /* Module Drawer */
        .module-drawer {
            display: none;
            border-top: 1px solid var(--border);
            background: var(--bg-subtle);
            padding: 0.75rem 1.25rem 1rem 1.25rem;
        }

        .module-card.active .module-drawer {
            display: block;
            animation: fadeIn 0.2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Clean Direct Clickable File Link */
        .file-link-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.9rem 1.15rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .file-link-item:hover {
            border-color: var(--accent);
            background: var(--bg-card);
            transform: translateX(4px);
            box-shadow: var(--shadow-sm);
        }

        .file-name-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .file-icon {
            color: var(--accent);
            display: flex;
            align-items: center;
        }

        .file-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .file-arrow {
            color: var(--text-muted);
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .file-link-item:hover .file-arrow {
            transform: translateX(3px);
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.7rem; }
            .module-header { padding: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header-nav">
        <div class="header-inner">
            <a href="#" class="brand">
                <div class="brand-icon">📁</div>
                <span>Image and Video Analysis</span>
            </a>
            <button class="btn-theme" onclick="toggleTheme()" id="theme-btn">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                Theme
            </button>
        </div>
    </header>

    <!-- Hero Title -->
    <section class="hero">
        <h1>Sessional-2</h1>
        <p>Select a module to view and open its files directly.</p>
    </section>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <div class="search-wrapper">
            <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" class="search-input" id="search-box" placeholder="Search modules or files..." oninput="filterModules()">
        </div>
        <div>
            <button class="btn-action" onclick="toggleAllModules(true)">Expand All</button>
            <button class="btn-action" onclick="toggleAllModules(false)">Collapse All</button>
        </div>
    </div>

    <!-- Modules Container -->
    <main class="modules-container" id="modules-list">
        <!-- Rendered dynamically by JavaScript -->
    </main>

    <script>
    // =========================================================================
    // CONFIGURATION DATA: Clean & Simple File Mapping
    // =========================================================================
    const MODULES_CONFIG = [
        {
            id: "module-3",
            name: "Module 3",
            icon: "📁",
            files: [
                {
                    name: "Module3_Part1.html",
                    path: "./Module3/Module3_Part1.html"
                },
                {
                    name: "Module3_Part2.html",
                    path: "./Module3/Module3_Part2.html"
                }
            ]
        },
        {
            id: "module-4",
            name: "Module 4",
            icon: "📁",
            files: [
                {
                    name: "Module4_Part1.html",
                    path: "./Module4/Module4_Part1.html",
                    // Also supports converted folder path if present:
                    altPath: "./IAV_Mod4_Part1/IAV_Mod4_Part1_Interactive.html"
                },
                {
                    name: "Module4_Part2.html",
                    path: "./Module4/Module4_Part2.html",
                    // Also supports converted standalone file if present:
                    altPath: "./IAV_Mod4_Part2/IAV_Mod4_Part2_Standalone.html"
                }
            ]
        },
        {
            id: "module-5",
            name: "Module 5",
            icon: "📁",
            files: [
                {
                    name: "Module5_Part1.html",
                    path: "./Module5/Module5_Part1.html"
                },
                {
                    name: "Module5_Part2.html",
                    path: "./Module5/Module5_Part2.html"
                }
            ]
        }
    ];

    // =========================================================================
    // RENDER LOGIC
    // =========================================================================
    function renderModules(filterText = "") {
        const container = document.getElementById("modules-list");
        container.innerHTML = "";
        const query = filterText.toLowerCase().trim();

        MODULES_CONFIG.forEach(mod => {
            const matchesMod = mod.name.toLowerCase().includes(query);
            const filteredFiles = mod.files.filter(f => matchesMod || f.name.toLowerCase().includes(query));

            if (query && filteredFiles.length === 0) return;

            const isExpanded = query ? true : false;

            const card = document.createElement("div");
            card.className = `module-card ${isExpanded ? 'active' : ''}`;
            card.id = `card-${mod.id}`;

            let filesHtml = "";
            filteredFiles.forEach(file => {
                filesHtml += `
                <a href="${file.path}" class="file-link-item" target="_self">
                    <div class="file-name-left">
                        <span class="file-icon">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        </span>
                        <span class="file-title">${file.name}</span>
                    </div>
                    <span class="file-arrow">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </span>
                </a>`;
            });

            card.innerHTML = `
                <div class="module-header" onclick="toggleModule('${mod.id}')">
                    <div class="module-info">
                        <div class="module-icon-badge">${mod.icon}</div>
                        <div class="module-title-wrap">
                            <h2>${mod.name}</h2>
                        </div>
                    </div>
                    <div class="module-meta-right">
                        <span class="file-counter-pill">${mod.files.length} files</span>
                        <svg class="chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                </div>
                <div class="module-drawer">
                    <div class="file-list">
                        ${filesHtml}
                    </div>
                </div>
            `;

            container.appendChild(card);
        });

        if (container.children.length === 0) {
            container.innerHTML = `
            <div style="text-align:center; padding: 2.5rem; color: var(--text-muted); background: var(--bg-card); border-radius: 12px; border: 1px dashed var(--border);">
                No matching files found.
            </div>`;
        }
    }

    function toggleModule(modId) {
        const card = document.getElementById(`card-${modId}`);
        if (card) {
            card.classList.toggle("active");
        }
    }

    function toggleAllModules(expand) {
        document.querySelectorAll(".module-card").forEach(c => {
            if (expand) c.classList.add("active");
            else c.classList.remove("active");
        });
    }

    function filterModules() {
        const q = document.getElementById("search-box").value;
        renderModules(q);
    }

    // Theme Switcher
    function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("module_portal_theme", next);
    }

    const savedTheme = localStorage.getItem("module_portal_theme");
    if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute("data-theme", "dark");
    }

    renderModules();
    </script>
</body>
</html>
